<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#642c99" />
    <!-- Link previews (Slack, LinkedIn, ...) do not run JS, so these are static. Title and description of each
         page are rendered by React (PageMeta); index.html has no <title>, a second one would be invalid. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miss Cupcake" />
    <meta property="og:title" content="Miss Cupcake" />
    <meta property="og:description" content="Fresh cupcakes baked every day. Pick your flavours, add them to your bag and check out." />
    <meta property="og:url" content="https://kotkoa.github.io/miss-cupcake/" />
    <meta property="og:image" content="https://kotkoa.github.io/miss-cupcake/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Three cupcakes floating above the words Miss cupcake on a pink background" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/wendy-one/files/wendy-one-latin-400-normal.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
